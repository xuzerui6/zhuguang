name: Native Builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "android/**"
      - "ios/**"
      - "native/**"
      - "src-tauri/**"
      - "scripts/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-builds.yml"

jobs:
  web-and-native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run native:check
      - run: npm run lint
      - run: npm test

  android-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run mobile:android:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android

  android-private-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ZHUGUANG_ANDROID_KEYSTORE: ${{ github.workspace }}/.signing/zhuguang-release.jks
      ZHUGUANG_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ZHUGUANG_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ZHUGUANG_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ZHUGUANG_API_BASE_URL: ${{ secrets.ZHUGUANG_API_BASE_URL }}
      VITE_PILOT_APP_KEY: ${{ secrets.ZHUGUANG_PILOT_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Restore release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: mkdir -p .signing && printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ZHUGUANG_ANDROID_KEYSTORE"
      - run: npm run mobile:android:release
      - uses: actions/upload-artifact@v4
        with:
          name: zhuguang-android-private-release
          path: |
            public/downloads/zhuguang-android-private-*.apk
            public/downloads/android-private-release.json
          retention-days: 3

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:ios:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**
