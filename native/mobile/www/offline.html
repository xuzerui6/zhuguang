<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>逐光离线</title>
    <style>
      body {
        align-items: center;
        background: #f6f8f5;
        color: #07120e;
        display: grid;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #fff;
        border: 1px solid #dde6de;
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(7, 18, 14, 0.12);
        display: grid;
        gap: 12px;
        max-width: 520px;
        padding: 24px;
      }

      h1 {
        font-size: 28px;
        margin: 0;
      }

      p {
        color: #65746b;
        line-height: 1.65;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前无法连接逐光平台</h1>
      <p>请检查网络或稍后重试。移动端原生壳已经加载，服务数据需要连接私有平台后继续使用。</p>
    </main>
  </body>
</html>
