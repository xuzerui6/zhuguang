workflows:
  ios-simulator-check:
    name: iOS Simulator Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      node: 24
      xcode: latest
      vars:
        ZHUGUANG_API_BASE_URL: https://api.beijingzhuguang.top
        ZHUGUANG_IOS_VERSION_NAME: 1.3.4
        ZHUGUANG_IOS_VERSION_CODE: 19
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund
      - name: Verify source
        script: |
          npm run lint:bounded
          npm test
          npm run native:check
      - name: Sync Capacitor iOS
        script: npm run mobile:ios:sync
      - name: Build unsigned simulator app
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/zhuguang-ios-simulator.log
    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/zhuguang-ios-simulator.log

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: zhuguang-app-store-connect
    environment:
      node: 24
      xcode: latest
      groups:
        - zhuguang-ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zhuguang.coachos
      vars:
        ZHUGUANG_API_BASE_URL: https://api.beijingzhuguang.top
        ZHUGUANG_IOS_VERSION_NAME: 1.3.4
        ZHUGUANG_IOS_VERSION_CODE: 19
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Install dependencies
        script: npm ci --no-audit --no-fund
      - name: Verify source
        script: |
          npm run lint:bounded
          npm test
          npm run native:check
      - name: Sync Capacitor iOS
        script: npm run mobile:ios:sync
      - name: Apply App Store signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
