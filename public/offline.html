<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07120e" />
    <title>逐光 Coach OS 离线</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #07120e;
        --muted: #65746b;
        --line: #dde6de;
        --brand: #0b7a53;
        --canvas: #f6f8f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          linear-gradient(rgba(7, 18, 14, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 18, 14, 0.035) 1px, transparent 1px),
          var(--canvas);
        background-size: 34px 34px, 34px 34px, auto;
        color: var(--ink);
        display: grid;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 28px 70px rgba(7, 18, 14, 0.14);
        display: grid;
        gap: 16px;
        margin: auto;
        max-width: 560px;
        padding: 28px;
      }

      img {
        height: 58px;
        width: 58px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.15;
        margin: 0;
      }

      p {
        color: var(--muted);
        line-height: 1.65;
        margin: 0;
      }

      button {
        background: var(--brand);
        border: 0;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        min-height: 44px;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>当前处于离线状态</h1>
      <p>逐光 App 已保留基础离线壳。网络恢复后，可以继续查看教练匹配、试课排期和运营工作台。</p>
      <button onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
